name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.REASONIX_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore.p12"

      - name: Build release APK
        env:
          REASONIX_STORE_FILE: ${{ github.workspace }}/keystore.p12
          REASONIX_STORE_PASSWORD: ${{ secrets.REASONIX_STORE_PASSWORD }}
          REASONIX_KEY_ALIAS: ${{ secrets.REASONIX_KEY_ALIAS }}
          REASONIX_KEY_PASSWORD: ${{ secrets.REASONIX_KEY_PASSWORD }}
        run: |
          if [ -n "$REASONIX_STORE_PASSWORD" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-app-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to Releases (tag push / manual)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Reasonix ${GITHUB_REF_NAME}" \
            --generate-notes || true
