apply plugin: 'com.android.application'

android {
    namespace 'io.reasonix.app'
    compileSdk 34

    defaultConfig {
        applicationId "io.reasonix.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            def storeFileEnv = System.getenv('REASONIX_STORE_FILE')
            if (storeFileEnv != null && !storeFileEnv.isEmpty()) {
                storeFile file(storeFileEnv)
                storePassword System.getenv('REASONIX_STORE_PASSWORD')
                keyAlias System.getenv('REASONIX_KEY_ALIAS')
                keyPassword System.getenv('REASONIX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def storeFileEnv = System.getenv('REASONIX_STORE_FILE')
            if (storeFileEnv != null && !storeFileEnv.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
